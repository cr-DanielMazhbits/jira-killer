<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jira Field Filler</title>
    <style>
        body {
            width: 300px;
            min-height: 200px;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
        }
        
        .header {
            background: #0052cc;
            color: white;
            padding: 16px;
            text-align: center;
        }
        
        .header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }
        
        .content {
            padding: 20px;
        }
        
        .current-issue {
            background: #e3f2fd;
            border: 1px solid #bbdefb;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 20px;
        }
        
        .current-issue-label {
            font-size: 12px;
            color: #1976d2;
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .current-issue-id {
            font-size: 16px;
            font-weight: 600;
            color: #1976d2;
        }
        
        .complete-button {
            width: 100%;
            padding: 12px 20px;
            background: #0052cc;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .complete-button:hover:not(:disabled) {
            background: #0065ff;
        }
        
        .complete-button:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        .status {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .no-issue {
            text-align: center;
            color: #666;
            font-size: 14px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Jira Field Filler</h1>
    </div>
    
    <div class="content">
        <div class="status" id="status"></div>
        
        <div class="current-issue" id="currentIssue" style="display: none;">
            <div class="current-issue-label">Current Issue:</div>
            <div class="current-issue-id" id="currentIssueId"></div>
        </div>
        
        <div class="no-issue" id="noIssue" style="display: none;">
            No Jira issue detected. Please navigate to a Jira issue page.
        </div>
        
        <button class="complete-button" id="completeTicket" style="display: none;">
            Complete Ticket
        </button>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
